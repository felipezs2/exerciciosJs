<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando valores</title>
</head>
<body>
    <h1>Somando valores</h1>
    <input type="number" name="n1" id="n1">
    +
    <input type="number" name="n2" id="n2">
    <input type="button" value="Somar" onclick="somar()">
    <p id="res"></p>

    <script>
        function somar () {
            var gn1 = document.querySelector('input#n1')
            var gn2 = document.querySelector('input#n2')
            var res = document.getElementById('res')
            var n1 = Number(gn1.value)
            var n2 = Number(gn2.value)
            var soma = n1 + n2
            res.innerHTML = `A soma de ${n1} + ${n2} é igual a ${soma}`
        }
    </script>
</body>
</html>
