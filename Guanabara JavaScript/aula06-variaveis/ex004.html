<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ex004</title>
</head>
<body>
<h1>Alo</h1>
    <script>
        var nome = prompt('Qual o seu nome? ')
        document.write(`Olá, ${nome}! Seu nome tem ${nome.length} letras`)
        document.write(`Seu nome em maiúsculas fica assim: ${nome.toUpperCase()}`)
        document.write(`Seu nome em minúsculas fica assim: ${nome.toLocaleLowerCase()}`)
    </script>
</body>
</html>
