<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="style.css">
    <title>ex003.2 Number</title>
</head>
<body>
    <header>
        <h1>Teste</h1>
    </header>
    
    <script>
        var n1 = Number(prompt('Vamos somar dois números. '+'Digite o primeiro número: '))
        var n2 = Number(prompt('Digite o segundo número: '))
        
        var soma = n1 + n2;
        alert (`A soma entre os números ${n1} + ${n2} é igual a: ${soma}`)

    </script>
</body>
