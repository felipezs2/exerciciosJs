<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ex004</title>
</head>
<body>
<h1>Alo</h1>
    <script>
        var n1 = Number(prompt('Digite um número decimal: '))

        document.write(`Esse é o seu número com 4 casas decimais: ${n1.toFixed(4)}`)
        document.write(`Esse é o seu número arredondado: ${n1.toFixed()}`)
    </script>
</body>
</html>
