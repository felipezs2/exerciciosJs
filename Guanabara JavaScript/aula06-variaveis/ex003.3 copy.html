<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ex003.3 String</title>
</head>
<body>
    <header>
        <h1>Teste</h1>
    </header>
     
    <script>
        var n1 = 10
        var n2 = Number(prompt('Enter a number: '))


        var soma = String(n1) + n2;
        alert(`A soma dos números ${n1} + ${n2} é igual a ${soma}`)

    </script>
</body>
</html>
