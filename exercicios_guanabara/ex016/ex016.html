<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>Contador</h1>
    </header>

    <section>
        <div>
            <label for="inicio">Inicío: </label>
            <input type="number" id="inicio">
        </div> <br>
        <div>
            <label for="fim">Fim: </label>
            <input type="number" id="fim">
        </div> <br>
        <div>
            <label for="passo">Passo: </label>
            <input type="number" id="passo">
        </div> <br>
        <input type="button" value="Contar" onclick="enviar()">

        <p id="retorno">Selecione os valores e aguarde a contagem...</p>
    </section>

    <footer>
        <p>&copy; FelipeAntunes</p>
    </footer>
</body>
</html>
