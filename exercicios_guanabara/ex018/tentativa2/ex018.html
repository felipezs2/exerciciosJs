<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>

    <section>
        <div>
            <label for="number">Insira um número (entre 1 e 100)</label> <br>
            <input type="number" id="number">
            <input type="button" id="add" value="Adicionar" onclick="sendNumber()">
        </div>
        <div>
            <select name="table" id="table" size="10"></select>
            <p id ='return'></p>
            <input type="button" id="finish" value="Finalizar" onclick="finish()">
        </div>
    </section>

    <footer>
        <!-- <p>Teste</p> -->
    </footer>
</body>
</html>
